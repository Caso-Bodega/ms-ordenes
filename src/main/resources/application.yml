server:
  port: ${PORT:8082}
  # Al detener o actualizar un contenedor, termina las peticiones en curso antes de apagarse.
  shutdown: graceful

spring:
  application:
    name: ms-ordenes
  config:
    # En Docker Swarm los secretos (DB_PASSWORD, JWT_SECRET, WEBHOOK_API_KEY) llegan como archivos en
    # /run/secrets. configtree los carga como propiedades con el nombre del archivo; si la carpeta no
    # existe (por ejemplo al correr en local) se ignora.
    import: optional:configtree:/run/secrets/
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # Base de datos propia del microservicio (database-per-service).
    # Los valores por defecto apuntan a un PostgreSQL local; se cambian con variables de entorno.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bodeganube_ordenes}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Hibernate crea o actualiza las tablas a partir de las entidades al iniciar.
      ddl-auto: update
    # La sesion de BD se cierra al terminar la transaccion del service, no al final de la peticion HTTP.
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        # Solo se expone la salud. /actuator/health/liveness la usa el HEALTHCHECK de la imagen y
        # /actuator/health (incluye la base de datos) la consulta el pipeline despues de desplegar.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  inventario:
    # URL de ms-inventario. En Docker es el nombre del servicio en la red (http://ms-inventario:8083).
    url: ${INVENTARIO_URL:http://localhost:8083}

resilience4j:
  retry:
    instances:
      inventario:
        max-attempts: 3
        wait-duration: 500ms
        # Solo se reintenta si inventario no respondio. Un 404 o 409 (producto inexistente o sin stock) es
        # una respuesta valida de negocio: reintentar no la cambia.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      inventario:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
